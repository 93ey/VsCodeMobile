<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1e1e1e"><title>VS Code Mobile</title>
<style>
:root{--bg:#1e1e1e;--panel:#252526;--panel2:#333;--line:#3c3c3c;--text:#d4d4d4;--muted:#858585;--blue:#007acc;--accent:#3794ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;height:100dvh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.titlebar{height:48px;background:#181818;display:flex;align-items:center;padding:0 13px;gap:11px;border-bottom:1px solid #111}.logo{color:#29a9f5;font-size:22px;font-weight:800}.title{font-weight:600;flex:1}.action{border:0;background:transparent;color:#ccc;font-size:18px;padding:8px;border-radius:6px}.action:active,.tool:active{background:#444}.tabs{height:39px;background:#252526;display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow:auto}.tab{padding:10px 13px;border-right:1px solid #1e1e1e;white-space:nowrap;color:#aaa}.tab.active{background:var(--bg);color:#fff;border-top:1px solid var(--accent)}.workspace{flex:1;display:flex;min-height:0}.activity{width:47px;background:#333;display:flex;flex-direction:column;align-items:center;padding-top:9px;gap:15px}.activity span{font-size:21px;color:#aaa;padding:7px}.activity span.sel{color:white;border-left:2px solid var(--accent)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.crumb{height:31px;padding:8px 12px;color:#999;font-size:12px;border-bottom:1px solid #292929}.editor{flex:1;display:flex;min-height:0;position:relative;background:#1e1e1e}.gutter{width:39px;padding:12px 8px 12px 0;text-align:right;color:#656565;font:13px/22px monospace;overflow:hidden;white-space:pre;user-select:none}.code{flex:1;resize:none;border:0;outline:0;background:transparent;color:#d4d4d4;padding:12px 10px 30px 0;font:13px/22px 'Consolas','Courier New',monospace;white-space:pre;overflow:auto;tab-size:2;caret-color:#fff}.welcome{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#888;pointer-events:none}.welcome b{font-size:22px;color:#ddd;margin-bottom:8px}.bottom{height:28px;background:#007acc;display:flex;align-items:center;padding:0 10px;gap:14px;color:#fff;font-size:11px}.bottom span:last-child{margin-left:auto}.toolbar{height:48px;background:#252526;border-top:1px solid #383838;display:flex;justify-content:space-around;align-items:center}.tool{border:0;background:transparent;color:#ccc;padding:9px 12px;border-radius:6px;font-size:12px}.tool b{display:block;font-size:18px;font-weight:400;margin-bottom:2px}.panel{display:none;height:35%;background:#181818;border-top:1px solid #444;padding:10px;font:12px monospace;color:#bbb}.panel.show{display:block}.panelhead{display:flex;justify-content:space-between;color:#ddd;margin-bottom:12px}.terminal-line{color:#8bd49c}.hint{color:#777;margin-top:8px}
</style></head><body><div class="app"><header class="titlebar"><div class="logo">▣</div><div class="title">VS Code Mobile</div><button class="action" onclick="newFile()" title="New file">＋</button><button class="action" onclick="Android.openFile()" title="Open">▱</button><button class="action" onclick="saveFile()" title="Save">⌑</button><button class="action" onclick="toggleMenu()" title="More">⋮</button></header><div class="tabs"><div class="tab active" id="tabname">● untitled.js</div></div><div class="workspace"><nav class="activity"><span class="sel">▤</span><span>⌕</span><span>⑂</span><span>▦</span><span style="margin-top:auto">⚙</span></nav><main class="main"><div class="crumb">workspace&nbsp; › &nbsp;<span id="crumbname">untitled.js</span></div><div class="editor"><div class="gutter" id="gutter">1</div><textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">// Welcome to VS Code Mobile

function hello() {
  console.log("Hello, world!");
  }

  hello();</textarea><div class="welcome" id="welcome"><b>Visual Studio Code</b><span>Code anywhere. Build everywhere.</span></div></div><div class="panel" id="terminal"><div class="panelhead"><span>TERMINAL</span><button class="action" onclick="toggleTerminal()">×</button></div><div><span class="terminal-line">$</span> Terminal preview is ready.</div><div class="hint">Connect a local runtime to execute commands.</div></div></main></div><div class="bottom"><span>⌁ main*</span><span>UTF-8</span><span>JavaScript</span><span id="cursor">Ln 1, Col 1</span></div><div class="toolbar"><button class="tool" onclick="newFile()"><b>＋</b>New</button><button class="tool" onclick="Android.openFile()"><b>▱</b>Open</button><button class="tool" onclick="saveFile()"><b>⌑</b>Save</button><button class="tool" onclick="toggleTerminal()"><b>›_</b>Terminal</button><button class="tool" onclick="insertTab()"><b>⇥</b>Indent</button></div></div>
  <script>
  const editor=document.getElementById('code'),gutter=document.getElementById('gutter');let filename='untitled.js';function lines(){let n=editor.value.split('\n').length;gutter.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}function updateCursor(){let p=editor.selectionStart,s=editor.value.slice(0,p).split('\n');document.getElementById('cursor').textContent=`Ln ${s.length}, Col ${s[s.length-1].length+1}`}editor.addEventListener('input',()=>{lines();updateCursor()});editor.addEventListener('keyup',updateCursor);editor.addEventListener('click',updateCursor);editor.addEventListener('scroll',()=>gutter.scrollTop=editor.scrollTop);function setName(n){filename=n;document.getElementById('tabname').textContent='● '+n;document.getElementById('crumbname').textContent=n;document.querySelector('.bottom span:nth-child(3)').textContent=n.split('.').pop().toUpperCase()}function newFile(){if(editor.value.trim()&&!confirm('Discard current editor content?'))return;editor.value='';setName('untitled.js');lines();editor.focus()}function saveFile(){Android.saveFile(filename,editor.value)}function toggleTerminal(){document.getElementById('terminal').classList.toggle('show')}function insertTab(){let a=editor.selectionStart,b=editor.selectionEnd;editor.setRangeText('  ',a,b,'end');editor.focus();lines()}function toggleMenu(){let v=prompt('Type: new, open, save, terminal');if(v==='new')newFile();if(v==='open')Android.openFile();if(v==='save')saveFile();if(v==='terminal')toggleTerminal()}window.loadOpenedFile=(name,text)=>{editor.value=text;setName(name);lines();updateCursor();Android.toast('File opened')};window.savedFile=()=>Android.toast('File saved');lines();updateCursor();
  </script></body></html>
